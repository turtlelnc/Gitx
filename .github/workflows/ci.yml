name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # All third-party dependencies are vendored in third_party/.
      # Linux still needs OpenSSL for libssh2's crypto backend (macOS has none
      # usable for building; Windows uses WinCNG/system OpenSSH).
      - name: Install system crypto dependency (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 4

      # Multi-config generators (MSVC) need an explicit configuration. The
      # timeout keeps a stuck test from hanging the job for minutes.
      # git2.dll lives in a subdirectory of the build tree; it must be on PATH
      # for the test executables to load it at startup.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\Debug;$env:PATH"
          $env:PATH = "${{ github.workspace }}\build\third_party\libgit2-1.8.4\Debug;$env:PATH"
          ctest --test-dir build -C Debug --output-on-failure --timeout 300

      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure --timeout 300
